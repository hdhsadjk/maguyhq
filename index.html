<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d91518">
  <title>優惠活動資訊</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f7f7f7; color: #222;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    main { width: min(100%, 760px); margin: 0 auto; padding: 16px; text-align: center; }
    .poster { display: block; width: 100%; height: auto; border-radius: 12px; }
    .cta {
      display: block; margin: 18px auto 12px; padding: 16px 22px; width: min(100%, 520px);
      border-radius: 999px; background: #d91518; color: #fff; text-decoration: none;
      font-weight: 800; font-size: 1.2rem;
    }
    .notice { max-width: 620px; margin: 12px auto; font-size: .9rem; line-height: 1.6; color: #555; }
  </style>
</head>
<body>
  <main>
    <img class="poster" src="./assets/coupon-poster.png" alt="優惠活動宣傳圖">
    <a class="cta" href="https://example.com/replace-with-your-coupon-url" rel="noopener noreferrer">
      前往優惠券領取頁面 →
    </a>
    <p class="notice">
      活動示意頁，並非品牌官方網站。優惠內容、資格及領取方式請以品牌官方公告為準。
    </p>
  </main>
</body>
</html>
